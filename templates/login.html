<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden transition-all duration-300 hover:shadow-xl">
        <div class="p-8">
            <div class="flex justify-center mb-6">
                <div class="bg-indigo-100 p-3 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
            </div>
            
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Restricted Access</h2>
            <p class="text-gray-500 text-center mb-8 text-sm">Please authenticate via Discord to continue.</p>
            
            <div id="step1" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Name / Identifier (Optional)</label>
                    <input type="text" id="username" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors" placeholder="e.g. Mike">
                </div>
                <button onclick="requestToken()" id="reqBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center space-x-2 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                        <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                    </svg>
                    <span>Send Login Code</span>
                </button>
                <p class="text-xs text-center text-gray-400">A one-time code will be sent to the configured Discord channel.</p>
            </div>

            <div id="step2" class="hidden space-y-4">
                <div class="bg-green-50 border border-green-100 rounded-lg p-3 text-sm text-green-700 flex items-center">
                    <svg class="h-5 w-5 mr-2 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Code sent! Please check Discord.
                </div>
                
                <form action="/login" method="POST" class="space-y-4">
                    <div>
                        <label for="code" class="block text-sm font-medium text-gray-700 mb-1">Enter Login Code</label>
                        <input type="text" name="code" id="code" required autocomplete="off" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors font-mono text-center tracking-wider text-lg placeholder-gray-300"
                            placeholder="Paste code here">
                    </div>
                    
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-md hover:shadow-lg">
                        Login
                    </button>
                </form>
                
                <button onclick="showStep1()" class="w-full text-gray-500 hover:text-gray-700 text-sm font-medium py-2 transition-colors">
                    &larr; Go Back
                </button>
            </div>
            
            <div id="message" class="hidden mt-4 p-3 rounded-lg text-sm text-center"></div>
        </div>
        <div class="bg-gray-50 px-8 py-4 border-t border-gray-100 text-center">
             <p class="text-xs text-gray-400">Secured by Webhook Auth Proxy</p>
        </div>
    </div>

    <script>
        const msgParams = new URLSearchParams(window.location.search);
        if (msgParams.has('error')) {
            const el = document.getElementById('message');
            el.textContent = "Invalid or expired code.";
            el.className = "mt-4 p-3 rounded-lg text-sm text-center bg-red-50 text-red-600 border border-red-100 block";
        }
        if (msgParams.has('code')) {
             document.querySelector('input[name="code"]').value = msgParams.get('code');
             showStep2();
        }

        function showStep1() {
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('message').className = "hidden mt-4 p-3 rounded-lg text-sm text-center";
        }

        function showStep2() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function requestToken() {
            const btn = document.getElementById('reqBtn');
            const username = document.getElementById('username').value.trim();
            
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg> Sending...`;
            
            // Clear previous messages
            document.getElementById('message').className = "hidden mt-4 p-3 rounded-lg text-sm text-center";
            
            fetch('/send-code', { 
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'username=' + encodeURIComponent(username)
            })
                .then(res => {
                    if (res.ok) {
                        showStep2();
                    } else if (res.status === 429) {
                        const el = document.getElementById('message');
                        el.textContent = "Rate limit exceeded. Try again later.";
                        el.className = "mt-4 p-3 rounded-lg text-sm text-center bg-yellow-50 text-yellow-600 border border-yellow-100 block";
                    } else {
                        const el = document.getElementById('message');
                        el.textContent = "Failed to send code. Please try again.";
                        el.className = "mt-4 p-3 rounded-lg text-sm text-center bg-red-50 text-red-600 border border-red-100 block";
                    }
                })
                .catch(err => {
                    const el = document.getElementById('message');
                    el.textContent = "Error connecting to server.";
                    el.className = "mt-4 p-3 rounded-lg text-sm text-center bg-red-50 text-red-600 border border-red-100 block";
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                });
        }
    </script>
</body>
</html>
